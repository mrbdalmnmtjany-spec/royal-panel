<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأدمن - Royal 👑</title>
<style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:15px}input,button,select{padding:13px;border-radius:12px;border:none;width:100%;margin:6px 0;font-size:15px}input,select{background:#222;color:#fff}button{background:#d4af37;color:#000;font-weight:bold}.card{background:#1a1a1a;padding:16px;border-radius:16px;margin:12px 0}.user{border-bottom:1px solid #333;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:#aaa}.badge{background:#d4af37;color:#000;padding:3px 8px;border-radius:20px;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center}</style>
</head>
<body>
<div class="top"><h2>👑 لوحة الأدمن</h2><button onclick="window.location.href='/'" style="width:auto;padding:8px 14px">🏠 الرئيسية</button></div>
<div class="card" id="meBox">جاري التحقق...</div>
<div class="card"><h3>💰 شحن رصيد</h3><input id="email" placeholder="ايميل المستخدم"><input id="amount" type="number" placeholder="المبلغ $ - مثال 5000"><button onclick="addBalance()">شحن الآن</button><p id="msg"></p></div>
<div class="card"><h3>📋 إدارة الطلبات</h3><button onclick="loadAdminOrders()" style="background:#333;color:#fff">⟳ تحديث الطلبات</button><div id="adminOrders">جاري التحميل...</div></div>
<div class="card"><h3>👥 المستخدمين <span id="count"></span></h3><button onclick="load()" style="background:#333;color:#fff">⟳ تحديث القائمة</button><div id="users">جاري التحميل...</div></div>
<script>
const token = localStorage.getItem('token');
if(!token){ alert('سجل دخول أولاً'); location.href='/'; }
async function checkMe(){
  const r = await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});
  const me = await r.json();
  if(!me.email){ document.getElementById('meBox').innerHTML='❌ التوكن منتهي - سجل خروج ودخول تاني'; return; }
  document.getElementById('meBox').innerHTML=`أنت داخل بـ: <b>${me.email}</b><br>عضويتك: <b>${me.memberId}</b> | رصيدك: <b>${me.balance}$</b> | ${me.isAdmin?'✅ <span class="badge">أدمن</span>':'❌ <b style="color:red">ليس أدمن - تأكد ADMIN_EMAIL في .env = نفس الإيميل دا واعمل خروج ودخول تاني</b>'}`;
  document.getElementById('email').value = me.email;
}
async function load(){
  const r = await fetch('/api/admin/users',{headers:{Authorization:'Bearer '+token}});
  const data = await r.json();
  if(data.message){ document.getElementById('users').innerHTML='❌ '+data.message; return; }
  document.getElementById('count').textContent='('+data.length+')';
  document.getElementById('users').innerHTML = data.map(u=>{ const em=u.email||u.username; return `<div class="user"><div><b>${u.name||'عضو'}</b><br><span class="small">${em} | ${u.memberId||''}</span><br>💰 <b style="color:#d4af37">${u.balance||0}$</b></div><button onclick="quickCharge('${em}')" style="width:auto;padding:8px 12px">شحن +</button></div>`; }).join('') || 'لا يوجد مستخدمين';
}
function quickCharge(email){ document.getElementById('email').value=email; document.getElementById('amount').focus(); window.scrollTo({top:0,behavior:'smooth'}); }
async function addBalance(){
  const email=document.getElementById('email').value.trim(); const amount=document.getElementById('amount').value;
  if(!email||!amount) return alert('اكتب الإيميل والمبلغ');
  const r=await fetch('/api/admin/add-balance',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({email,amount})});
  const d=await r.json(); document.getElementById('msg').innerText=d.message||'تم'; if(r.ok) load();
}
async function loadAdminOrders(){
  const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});
  const orders=await r.json();
  if(orders.message){ document.getElementById('adminOrders').innerHTML='❌ '+orders.message; return; }
  if(!orders.length){ document.getElementById('adminOrders').innerHTML='لا توجد طلبات'; return; }
  document.getElementById('adminOrders').innerHTML=orders.map(o=>{
    const color=o.status==='pending'?'#ffcc00':o.status==='running'?'#00aaff':o.status==='completed'?'#00c853':'#ff3b30';
    const label=o.status==='pending'?'🟡 قيد الانتظار':o.status==='running'?'🔵 جاري التنفيذ':o.status==='completed'?'🟢 مكتمل':'🔴 ملغي';
    return `<div style="border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0"><b>${o.service}</b> <span style="color:${color};font-weight:bold">${label}</span><br><span class="small">👤 ${o.email} | 🔗 ${o.link}</span><br><span class="small">📦 الكمية: ${o.quantity} | 💰 ${o.price}$ | 🕒 ${new Date(o.createdAt).toLocaleString('ar')}</span><br><div style="display:flex;gap:6px;margin-top:8px"><button onclick="changeStatus('${o._id}','running')" style="background:#00aaff">▶️ بدء التنفيذ</button><button onclick="changeStatus('${o._id}','completed')" style="background:#00c853">✅ تأكيد واكتمال</button><button onclick="changeStatus('${o._id}','cancelled')" style="background:#ff3b30;color:#fff">❌ إلغاء + إرجاع الرصيد</button></div></div>`;
  }).join('');
}
async function changeStatus(orderId,status){
  if(status==='cancelled' && !confirm('هل تريد إلغاء الطلب وإرجاع الرصيد للمستخدم؟')) return;
  if(status==='completed' && !confirm('تأكيد اكتمال الطلب؟')) return;
  const r=await fetch('/api/admin/order-status',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({orderId,status})});
  const d=await r.json(); alert(d.message); loadAdminOrders();
}
checkMe(); load(); loadAdminOrders();
</script>
</body>
</html>
